[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-assessment-pipeline"
version = "1.0.0"
description = "Voice/Note -> Structured Clinical Assessment (FirstAssessment) pipeline"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["app"]
